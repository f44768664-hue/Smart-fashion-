<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fashion</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: white;
    }

    .logo span {
      color: #00ff66;
    }

    .hero {
      padding: 70px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 span {
      color: #00ff66;
    }

    p {
      color: #ccc;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #00ff66;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }

    .products {
      padding: 30px 15px;
    }

    .products h2 {
      font-size: 30px;
    }

    .card {
      background: #111;
      margin: 15px auto;
      padding: 25px;
      max-width: 350px;
      border-radius: 12px;
      border: 1px solid #222;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      background: #111;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Smart <span>Fashion</span></div>
  </header>

  <section class="hero">
    <h1>Welcome to <span>Smart Fashion</span></h1>
    <p>স্টাইলিশ পোশাক, সঠিক দামে</p>
    <a href="#" class="btn">Shop Now</a>
  </section>

  <section class="products">
    <h2>Our Products</h2>

    <div class="card">
      <h3>Men's Fashion</h3>
      <p>স্টাইলিশ পুরুষদের পোশাক</p>
    </div>

    <div class="card">
      <h3>Women's Fashion</h3>
      <p>আধুনিক ও সুন্দর পোশাক</p>
    </div>

    <div class="card">
      <h3>Kids Fashion</h3>
      <p>শিশুদের জন্য সুন্দর পোশাক</p>
    </div>
  </section>

  <footer>
    © 2026 Smart Fashion
  </footer>

</body>
  </html>
